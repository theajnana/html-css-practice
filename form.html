<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Patient-Login</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
<div class=" form-container">
   <div class="form-header">
   <h2> Jude Community Hospital</h2>
    <p>Patient Registration & Medical History Form</p>
 </div>
  <!--SECTION 1: PERSONAL INFORMATION-->
   <fieldset>
    <legend> SECTION 1: PERSONAL INFORMATION</legend>
     <div class="form-row">
    <div class="form-group flex-2">
        <label for="fullname">Full Name</label>
         <input type="text" id="fullname" name="fullname">
    </div>
     <div class="form-group flex-1">
        <label for="dob">Date of birth</label>
        <input type="date" id="dob" name="dob" required>
     </div>
      <div class="form-group flex-1">
        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="0" max="120">
      </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
            <label for="gender">Biological Sex</label>
            <select id="gender" name="gender" required>
             <option value="" disabled selected>Select sex</option>
             <option value="female">Female</option>
             <option value="male">Male</option>
             <option value ="other">Other</option>
            </select>
        </div>
        <div class="form-group flex-1">
            <label for="email">Email Address </label>
            <input type="text" id="email" name="email" placeholder="mike.gabriel@email.com" required>
        </div>
        <div class="form-group flex-1">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="+234...." required>
        </div>
        </div>
        
      <div class="form-row">
        <div class="form-group flex-2">
            <label for="address">Resdential Address</label>
            <input type="text" id="address" name="address" placeholder="No.23,st.james,P.O Box..." required>
        </div>
        <div class=" form-group flex-1">
            <label for="occupation">occupation</label>
            <input type="text" id="occupation" name="occupation" placeholder="Archictect"
        </div>
      </div>
   </fieldset>
    <!--SECTION 2:MEDICAL HISTORY-->
     <fieldset>
        <legend> SECTION 2:MEDICAL DETAILS </legend>
        <div class="form-row">
        <div class="form-group flex-1">
          <label for="bloodtype">Blood type</label>
          <select id="bloodtype" name="bloodtype">
            <option value=""disabled selected>Select type</option>
            <optgroup label="common">
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="O+">O+ </option>
            </optgroup>
            <optgroup label="Rare">
                <option value="B-">B-</option>
                <option value="AB+">AB+</option> 
                <option value="AB-">AB-</option>
                <option value="O-">O-</option>
            </optgroup>
          </select>
        </div>
        
        <div class="form-group flex-1">
            <label for="insurance">Primary insurance</label>
            <input type="text" id="insurance" name="insurance" placeholder="BlueCross">
        </div>
        <div class="form-group flex-1">
            <label for="department">Department</label>
            <input list="department" id="department" name="department" placeholder="type or select">
            <datalist id="department">
              <option value="General Medicine">General Medicine</option>
              <option value="Pediatrics">Pediatrics</option>
             <option value="Cardiology">Cardiology</option>
             <option value="Orthopedics">Orthopedics</option>
             <option value="Dermatology">Dermatology</option>
             <option value="Neurology">Neurology</option>
            </datalist>
        </div>
        </div>

        <div class="form-group">
            <label for="pain-level">Current pain level(0 to 10)</label>
            <div class="range-container">
                <span>0 (none)</span>
                <input type="range" id="pain-level" name="pain-level"min="0" max="10" value="0">
                <span>10 (severe)</span>
            </div>
        </div>
        <div class="form-group">
            <label>Pre-execisting Conditions</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="Conditions[]" value="hypertension">High Blood Pressure</label>
                <label><input type="checkbox" name="Conditions[]" value="asthma">Asthma</label>
                <label><input type="checkbox" name="Conditions[]" value="diabetes">Diabetes</label>
                <label><input type="checkbox" name="Conditions[]" value="allergies">Allergies</label>
                <label><input type="checkbox" name="Conditions[]" value="none">None</label>
            </div>
        </div>
        <div class="form-group">
            <label for="reason">Reason</label>
            <textarea id="reason" name="reason" rows="4" cols="50" placeholder="Describe symptoms or reasons for consultattion.."></textarea>
        </div>
     </fieldset> 

      <!--SECTION 3:APPIONTMENT&ATTACHMENT-->
      <fieldset>
         <legend>Appiontment &Document</legend>
       <div class="form-row">
        <div class="form-group flex-1">
          <label for="appt-date"> preferred Date</label>
          <input type="date" id="appt-date" name="appt-date">
        </div>
        <div class="form-group flex-1">
            <label for="appt-time">Preferred Time</label>
            <input type="time" id="appt-time" name="appt-time">
        </div>
            <div class="form-group flex-1">
                <label for="id-upload">upload Identification</label>
                <input type="file" id="id-upload" name="id-upload" accept="image/*,.pdf">
            </div>
       </div>
         <div class="form-group">
            <label> Preferred Contact Method</label>
            <label><input type="radio" name="Contact-method" value="email" checked>Email</label>
            <label><input type="radio" name="Contact-method" value="phone">phone call</label>
            <label><input type="radio" name="Contact-method" value="SMS"> SMS</label>
         </div>
            <div class="form-group consent">
                <label for="consent"> I confirm that the information provided
                     is correct and i agree to its use for my appointment.</label>
                <input type="checkbox" name="consent" required>
                
            </div>
      </fieldset>
       
      <!--ATION BUTTONS-->
       <div class="button-group">
        <button type="reset" class="btn btn-reset">Reset Form</button>
        <button type="submit" class="btn btn-submit">Submit Form</button>
       </div>

</div>
    
</body>
</html>
